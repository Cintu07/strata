[workspace]
resolver = "3"
members = [
    "crates/strata-format",
    "crates/strata-cache",
    "crates/strata-layout",
    "crates/strata-io",
    "crates/strata-prefill",
    "crates/strata-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Cintu07/strata"

[workspace.lints.rust]
missing_docs = "warn"
# deny rather than forbid, so that strata-io can allow it locally. it talks to
# io_uring, where handing the kernel a raw buffer pointer is the entire job.
# every other crate in the workspace is unsafe free and should stay that way.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
